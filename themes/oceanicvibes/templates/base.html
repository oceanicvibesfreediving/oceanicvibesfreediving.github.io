<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}OceanicVibes{% endblock %}</title>
  {% block meta %}{% endblock %}
  <link rel="icon" type="image/jpeg" href="{{ SITEURL }}/images/logo.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600;700&family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ SITEURL }}/theme/css/journal.css">
  <script>document.documentElement.className += ' js';</script>
</head>
<body>
  <a class="j-skip" href="#main">Skip to the notes</a>
  <div class="j-surface" aria-hidden="true"></div>
  <div class="j-grain" aria-hidden="true"></div>
  <div class="j-caustic" aria-hidden="true"></div>

  <header class="j-header">
    <a class="j-brand" href="{{ SITEURL }}/" aria-label="OceanicVibes homepage">
      <span class="j-brand-mark">OV</span>
      <span class="j-brand-strong">Oceanic<em>Vibes</em></span>
    </a>
    <span class="j-note-tag"><i aria-hidden="true"></i>Field notes</span>
    <nav class="j-nav" aria-label="Journal navigation">
      <a class="{% block nav_now %}{% endblock %}" href="{{ SITEURL }}/articles.html">Journal</a>
      <a href="{{ SITEURL }}/">← Home</a>
    </nav>
  </header>

  <main id="main" class="j-main">
    {% block content %}{% endblock %}
  </main>

  <footer class="j-footer">
    <a class="j-footer-back" href="{{ SITEURL }}/">← Return to OceanicVibes</a>
    <p class="j-footer-note">Field notes written by Ada.<span>Playa del Carmen · Bacalar · Riviera Maya</span></p>
  </footer>

  <script>
    (function(){
      var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduce) return;
      var items = document.querySelectorAll('.j-rv');
      if (!('IntersectionObserver' in window)) { items.forEach(function(el){ el.classList.add('j-in'); }); return; }
      var io = new IntersectionObserver(function(entries){
        entries.forEach(function(entry){
          if (entry.isIntersecting) { entry.target.classList.add('j-in'); io.unobserve(entry.target); }
        });
      }, { threshold: 0.15 });
      items.forEach(function(el){ io.observe(el); });
    })();
  </script>
</body>
</html>
